[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "airbornediag"
dynamic = ["version"]
description = "面向民机机载系统的智能故障诊断工程"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
airbornediag = "airbornediag.cli:main"

[tool.setuptools.dynamic]
version = { attr = "airbornediag.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
