[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "airbornediag"
dynamic = ["version"]
description = "面向民机机载系统的智能故障诊断工程"
readme = "README.md"
requires-python = ">=3.9"
# jsonschema 用于实际执行 schemas/ 下的契约校验。下界 4.18 是 registry/resolver
# API 的引入版本，跨文件 $ref 依赖该 API；上界防止主版本变更破坏解析行为。
dependencies = ["jsonschema>=4.18,<5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
airbornediag = "airbornediag.cli:main"

[tool.setuptools.dynamic]
version = { attr = "airbornediag.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
